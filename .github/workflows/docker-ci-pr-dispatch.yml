name: ci-pr-dispatched

on:
    workflow_dispatch:

jobs:

    preset-variables:
      runs-on: ubuntu-latest
      permissions: {}
      outputs:
        image-name: ${{ steps.preset-env-vars.outputs.IMAGE_NAME }}
        github-image-name: ${{ steps.preset-env-vars.outputs.GITHUB_IMAGE_NAME }}
        latest-tag: ${{ steps.preset-env-vars.outputs.LATEST_TAG }}
        test-tag: ${{ steps.preset-env-vars.outputs.TEST_TAG }}
        branch-end: ${{ steps.get-git-indeterminate-branch.outputs.BRANCH_END }}
      steps:
        - name: Preset Environment Variables
          id: preset-env-vars
          run: |
            echo "IMAGE_NAME=jlp04/elevation-generator" >> $GITHUB_OUTPUT
            echo "GITHUB_IMAGE_NAME=ghcr.io/jlp04/elevation-generator" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=latest" >> $GITHUB_OUTPUT
            echo "TEST_TAG=test" >> $GITHUB_OUTPUT

        - name: Get Git Indeterminate Branch
          id: get-git-indeterminate-branch
          run: echo "BRANCH_END=$(git ls-remote --heads "https://gitlab.com/flightgear/flightgear.git" | sed -nEe 's@.*[ \t]+refs/heads/release/([^ \t]+)@\1@p' | sort -t . -k 1,1n -k2,2n -k3,3n | tail -1 | tr -d '\n')" >> $GITHUB_OUTPUT
  
    docker-pr-validate:
        needs:
            - preset-variables
        uses: docker/github-builder/.github/workflows/bake.yml@175bf5d95f73a62ca80f924166a1ab98bf045c24 # v1
        permissions:
          contents: read
          id-token: write
        with:
          runner: |
            default=ubuntu-26.04-arm
            linux/386=ubuntu-latest
            linux/amd64=ubuntu-latest
          setup-qemu: true
          cache: true
          cache-mode: max
          output: image
          source-date-epoch: commit
          target: validate-build
          set-meta-annotations: true
          set-meta-labels: true
          meta-images: ${{ needs.preset-variables.outputs.github-image-name }}
          meta-tags: ${{ needs.preset-variables.outputs.test-tag }}
          set: default.args.branch_end=${{ needs.preset-variables.outputs.branch-end }}

    docker-pr:
      needs:
          - preset-variables
          - docker-pr-validate
      uses: docker/github-builder/.github/workflows/bake.yml@175bf5d95f73a62ca80f924166a1ab98bf045c24 # v1
      permissions:
        contents: read
        packages: write
        id-token: write
      with:
        runner: |
          default=ubuntu-26.04-arm
          linux/386=ubuntu-latest
          linux/amd64=ubuntu-latest
        setup-qemu: true
        cache: true
        cache-mode: max
        output: image
        push: true
        sbom: true
        source-date-epoch: commit
        target: default
        set-meta-annotations: true
        set-meta-labels: true
        meta-images: ${{ needs.preset-variables.outputs.github-image-name }}
        meta-tags: ${{ needs.preset-variables.outputs.test-tag }}
        set: default.args.branch_end=${{ needs.preset-variables.outputs.branch-end }}
      secrets:
        registry-auths: |
          - registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

    docker-pr-scout:
        runs-on: ubuntu-latest
        permissions:
          packages: read
        needs:
          - preset-variables
          - docker-pr
        steps:
          - name: Login to Docker Hub
            uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
            with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_PASSWORD }}

          - name: Login to GitHub Container Registry
            uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Set up QEMU
            uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

          - name: Scout i386
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/386
              only-fixed: true

          - name: Scout AMD64
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/amd64
              only-fixed: true

          - name: Scout ARMV5
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/arm/v5
              only-fixed: true

          - name: Scout ARMV7
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/arm/v7
              only-fixed: true

          - name: Scout ARM64
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/arm64
              only-fixed: true

          - name: Scout PPC64
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/ppc64le
              only-fixed: true

          - name: Scout RISCV64
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/riscv64
              only-fixed: true

          - name: Scout s390x
            uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
            with:
              command: quickview,cves,recommendations,compare
              image: ${{ needs.preset-variables.outputs.github-image-name }}:${{ needs.preset-variables.outputs.test-tag }}
              to: ${{ needs.preset-variables.outputs.image-name }}:${{ needs.preset-variables.outputs.latest-tag }}
              platform: linux/s390x
              only-fixed: true