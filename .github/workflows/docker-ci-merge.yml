name: ci-merge

on:
    pull_request_target:
        types:
            - labeled

env: 
    IMAGE_NAME: jlp04/elevation-generator
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    docker-merge:
        if: contains(github.event.pull_request.labels.*.name, 'pr-pull') && ((github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') || contains(github.event.pull_request.labels.*.name, 'run-ci-pr'))
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: read
          pull-requests: write
          security-events: write
        steps:
            - name: Free Up Space
              uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
              with:
                preinstalled-runtimes: true

            - name: Free Up More Space
              run: |
                sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/lib/jvm || true
                sudo apt autoremove -y
                sudo apt clean

            - name: Clean Old Package Config
              run: sudo apt purge -y '~c'
              
            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
                
            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Checkout Repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: ${{ github.event.pull_request.head.ref }}

            - name: Push Image to Docker Hub
              run: |
                docker buildx imagetools create \
                --tag jlp04/elevation-generator:latest \
                ghcr.io/jlp04/elevation-generator:test

            - name: Scout i386
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/386
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results i386
              id: upload-sarif-i386
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: i386

            - name: Scout AMD64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/amd64
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results AMD64
              id: upload-sarif-amd64
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: amd64

            - name: Scout ARMV5
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm/v5
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results ARMV5
              id: upload-sarif-armv5
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: armv5

            - name: Scout ARMV7
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm/v7
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results ARMV7
              id: upload-sarif-armv7
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: armv7

            - name: Scout ARM64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm64
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results ARM64
              id: upload-sarif-arm64
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: arm64

            - name: Scout PPC64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/ppc64le
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results PPC64
              id: upload-sarif-ppc64
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: ppc64

            - name: Scout RISCV64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/riscv64
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results RISCV64
              id: upload-sarif-riscv64
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: riscv64

            - name: Scout s390x
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/s390x
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results s390x
              id: upload-sarif-s390x
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: s390x

            - name: Merge PR
              run: git pull --all && gh pr merge -md