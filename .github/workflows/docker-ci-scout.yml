name: ci-scout

on:
    schedule:
        - cron: 46 4 * * 5

env:
    IMAGE_NAME: jlp04/elevation-generator:latest

jobs:
    docker-scout:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Scout i386
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/386
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results i386
              id: upload-sarif-i386
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: i386

            - name: Scout AMD64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/amd64
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results AMD64
              id: upload-sarif-amd64
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: amd64

            - name: Scout ARMV5
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm/v5
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results ARMV5
              id: upload-sarif-armv5
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: armv5

            - name: Scout ARMV7
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm/v7
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results ARMV7
              id: upload-sarif-armv7
              uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
              with: 
                sarif_file: sarif.output.json
                category: armv7

            - name: Scout ARM64
              uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/arm64
                sarif-file: sarif.output.json
