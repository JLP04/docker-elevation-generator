              with: 
                sarif_file: sarif.output.json
                category: arm64

            - name: Scout PPC64
              uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/ppc64le
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results PPC64
              id: upload-sarif-ppc64
              uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
              with: 
                sarif_file: sarif.output.json
                category: ppc64

            - name: Scout RISCV64
              uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/riscv64
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results RISCV64
              id: upload-sarif-riscv64
              uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
              with: 
                sarif_file: sarif.output.json
                category: riscv64

            - name: Scout s390x
              uses: docker/scout-action@2688993af7bafd6ba8c6a74ec652442be91dd82b # v1.23.1
              with:
                command: quickview,cves,recommendations
                image: jlp04/elevation-generator:latest
                platform: linux/s390x
                sarif-file: sarif.output.json
                only-fixed: true

            - name: Upload SARIF Results s390x
              id: upload-sarif-s390x
              uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
              with: 
                sarif_file: sarif.output.json
                category: s390x